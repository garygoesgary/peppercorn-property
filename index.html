<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peppercorn Property — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #2d361a;
      font-family: 'Inria Serif', serif;
      text-align: center;
      overflow: hidden;
    }
    .bg-leaves {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
    }
    .content h1 {
      color: #ffffff;
      font-weight: 400;
      font-size: clamp(2.5rem, 8vw, 4.2rem);
    }
    .content img {
      margin-top: 1.5rem;
      width: clamp(160px, 20vw, 256px);
      height: auto;
    }
  </style>
</head>
<body>
  <img class="bg-leaves" src="assets/leaves-bkg.svg" alt="">
  <div class="content">
    <h1>Coming Soon</h1>
    <img src="assets/peppercorn-logo-white.svg" alt="Peppercorn Property Solutions">
  </div>
</body>
</html>
