<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peppercorn Property — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { width: 100%; }
    body {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #2d361a;
      font-family: 'Inria Serif', Georgia, 'Times New Roman', serif;
      text-align: center;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('assets/leaves-bkg.svg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      opacity: 0.5;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      padding: 1rem;
      max-width: 90vw;
    }
    .content h1 {
      color: #ffffff;
      font-weight: 400;
      font-size: clamp(2.5rem, 8vw, 4.2rem);
    }
    .content img {
      display: block;
      margin: 1.5rem auto 0;
      width: clamp(208px, 26vw, 333px);
      height: auto;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Coming Soon</h1>
    <img src="assets/peppercorn-logo-white.svg" alt="Peppercorn Property Solutions">
  </div>
</body>
</html>
